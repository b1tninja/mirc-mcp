[project]
name = "mirc-mcp"
version = "0.1.0"
description = "Local stdio MCP server for mIRC over its SendMessage interface, with an allowlist policy"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["mcp>=2.3,<3", "cryptography>=42"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
mirc-mcp = "mirc_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mirc_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
